# Android cross-compilation via the NDK's bundled Clang toolchain.
# NDK_HOME must point at an installed NDK (see BUILD.md); this repo was
# built against NDK 28.2.13676358 on Windows.
#
# minSdk = 30 (Android 11) per android/app/build.gradle.kts, hence the
# "*-android30-clang" wrappers below.

[target.aarch64-linux-android]
ar = "C:/AndroidSDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
linker = "C:/AndroidSDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android30-clang.cmd"

[target.armv7-linux-androideabi]
ar = "C:/AndroidSDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
linker = "C:/AndroidSDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi30-clang.cmd"

[target.x86_64-linux-android]
ar = "C:/AndroidSDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
linker = "C:/AndroidSDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android30-clang.cmd"
