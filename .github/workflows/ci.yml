name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - name: Build release cdylib
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: dupora_engine-windows
          path: rust/target/release/dupora_engine.dll

  dart:
    name: Dart/Flutter (format, analyze, test)
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - uses: actions/download-artifact@v4
        with:
          name: dupora_engine-windows
          path: rust/target/release
      - run: flutter test

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: [rust, dart]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: cargo build --release
        working-directory: rust
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: dupora-windows-release
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android release (unsigned)
    runs-on: ubuntu-latest
    needs: [rust, dart]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28b
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Cross-compile native engine
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo build --release --target "$target"
          done
      - name: Stage jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp rust/target/aarch64-linux-android/release/libdupora_engine.so android/app/src/main/jniLibs/arm64-v8a/
          cp rust/target/armv7-linux-androideabi/release/libdupora_engine.so android/app/src/main/jniLibs/armeabi-v7a/
          cp rust/target/x86_64-linux-android/release/libdupora_engine.so android/app/src/main/jniLibs/x86_64/
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dupora-android-release
          path: build/app/outputs/flutter-apk/*.apk

  build-macos:
    name: Build macOS release
    runs-on: macos-latest
    needs: [rust, dart]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build universal native engine
        working-directory: rust
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/release/libdupora_engine.dylib \
            target/aarch64-apple-darwin/release/libdupora_engine.dylib \
            target/x86_64-apple-darwin/release/libdupora_engine.dylib
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: dupora-macos-release
          path: build/macos/Build/Products/Release/dupora.app

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    needs: [rust, dart]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: cargo build --release
        working-directory: rust
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: dupora-linux-release
          path: build/linux/x64/release/bundle/
